[project]
name = "pulse"
version = "0.1.0"
description = "Weekly App Review Pulse for Zerodha Kite"
requires-python = ">=3.11"
dependencies = [
    "google-play-scraper>=1.2.7",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
